name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Format
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build every release target
        run: ./build.sh dev
      - name: Lint the install scripts
        run: shellcheck build.sh install.sh uninstall.sh release-notes.sh
      - name: Release notes of every version in the changelog
        run: |
          for v in $(awk '/^## v/ { print $2 }' CHANGELOG.md); do
            ./release-notes.sh "$v" > /dev/null
          done
