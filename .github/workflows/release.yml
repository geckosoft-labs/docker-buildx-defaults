name: Release

# Pushing a tag v<x>.<y>.<z> publishes its release: the binaries, their
# SHA256SUMS and their build provenance (gh attestation verify)
on:
  push:
    tags: ['v*']

permissions:
  contents: write # the release
  id-token: write # the attestations
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Test
        run: go vet ./... && go test ./...
      - name: Build
        run: ./build.sh "$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/docker-buildx-cache-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
